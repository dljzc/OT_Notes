<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工业协议 - OT 工程师笔记</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#0d1117;color:#c9d1d9;line-height:1.6}
.container{max-width:820px;margin:0 auto;padding:48px 24px}
h1{font-size:2em;margin-bottom:24px;color:#58a6ff}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:16px 0}
a.card{display:block;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:12px 16px;text-decoration:none;color:#c9d1d9;transition:border-color .15s}
a.card:hover{border-color:#58a6ff}
a.card strong{display:block;color:#58a6ff;font-size:.95em}
a.card span{font-size:.85em;color:#8b949e}
.btn-back{display:inline-block;margin-top:32px;color:#58a6ff;text-decoration:none}
.btn-back:hover{text-decoration:underline}
.lang-switch{display:inline-block;margin-bottom:16px}
.lang-switch select{padding:4px 8px;font-size:14px;border-radius:4px;background:#161b22;color:#c9d1d9;border:1px solid #30363d}
.lang-switch select:focus{outline:none;border-color:#58a6ff}
</style>
</head>
<body>
<div class="container">
<div class="lang-switch">
<select id="lang-select" onchange="switchLang(this.value)">
<option value="zh-CN">中文</option>
<option value="en-US">English</option>
</select>
</div>
<h1 data-zh="📡 工业协议笔记" data-en="📡 Industrial Protocol Notes">📡 工业协议笔记</h1>

<h2 data-zh="Modbus" data-en="Modbus">Modbus</h2>
<div class="nav-grid">
<a class="card" href="#" data-zh="Modbus RTU" data-en="Modbus RTU"><strong>Modbus RTU</strong><span>串口，二进制，CRC 校验</span></a>
<a class="card" href="#" data-zh="Modbus TCP" data-en="Modbus TCP"><strong>Modbus TCP</strong><span>以太网，MBAP 头，TCP 连接</span></a>
<a class="card" href="#" data-zh="Modbus ASCII" data-en="Modbus ASCII"><strong>Modbus ASCII</strong><span>ASCII 编码，LRC 校验</span></a>
</div>

<h2 data-zh="DNP3" data-en="DNP3">DNP3</h2>
<div class="nav-grid">
<a class="card" href="#" data-zh="DNP3 3.0" data-en="DNP3 3.0"><strong>DNP3 3.0</strong><span>电力行业标准，报文框架、功能码、时序同步</span></a>
<a class="card" href="#" data-zh="DNP3 协议栈" data-en="DNP3 Protocol Stack"><strong>DNP3 协议栈</strong><span>物理层、数据链路层、应用层</span></a>
</div>

<h2 data-zh="OPC UA" data-en="OPC UA">OPC UA</h2>
<div class="nav-grid">
<a class="card" href="#" data-zh="OPC UA 标准" data-en="OPC UA Standard"><strong>OPC UA 标准</strong><span>客户端-服务器架构，浏览、读写、订阅、方法调用</span></a>
<a class="card" href="#" data-zh="OPC UA 报文" data-en="OPC UA Messages"><strong>OPC UA 报文</strong><span>Header, Body，服务器端口 4481</span></a>
<a class="card" href="#" data-zh="OPC UA 安全" data-en="OPC UA Security"><strong>OPC UA 安全</strong><span>证书、信任策略、安全策略、加密</span></a>
</div>

<a class="btn-back" href="/" data-zh="返回主页" data-en="Return to Home">← 返回主页</a>
</div>

<script>
let currentLang = 'zh-CN';

function switchLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  const els = document.querySelectorAll('[data-zh][data-en]');
  for (const el of els) {
    el.textContent = el.getAttribute('data-' + lang);
  }
}
</script>
</body>
</html>

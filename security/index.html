<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安全实践 - OT 工程师笔记</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#0d1117;color:#c9d1d9;line-height:1.6}
.container{max-width:820px;margin:0 auto;padding:48px 24px}
h1{font-size:2em;margin-bottom:24px;color:#58a6ff}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:16px 0}
a.card{display:block;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:12px 16px;text-decoration:none;color:#c9d1d9;transition:border-color .15s}
a.card:hover{border-color:#58a6ff}
a.card strong{display:block;color:#58a6ff;font-size:.95em}
a.card span{font-size:.85em;color:#8b949e}
.btn-back{display:inline-block;margin-top:32px;color:#58a6ff;text-decoration:none}
.btn-back:hover{text-decoration:underline}
.lang-switch{display:inline-block;margin-bottom:16px}
.lang-switch select{padding:4px 8px;font-size:14px;border-radius:4px;background:#161b22;color:#c9d1d9;border:1px solid #30363d}
.lang-switch select:focus{outline:none;border-color:#58a6ff}
</style>
</head>
<body>
<div class="container">
<div class="lang-switch">
<select id="lang-select" onchange="switchLang(this.value)">
<option value="zh-CN">中文</option>
<option value="en-US">English</option>
</select>
</div>
<h1 data-zh="🔒 安全实践笔记" data-en="🔒 Security Practice Notes">🔒 安全实践笔记</h1>

<a class="card" href="#" data-zh="身份与权限" data-en="Identity & Access"><strong>身份与权限</strong><span>RBAC，最小权限，多因子认证</span></a>
<a class="card" href="#" data-zh="补丁管理" data-en="Patch Management"><strong>补丁管理</strong><span>工业补丁，测试与部署</span></a>

<a class="btn-back" href="/" data-zh="返回主页" data-en="Return to Home">← 返回主页</a>
</div>

<script>
let currentLang = 'zh-CN';

function switchLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  const els = document.querySelectorAll('[data-zh][data-en]');
  for (const el of els) {
    el.textContent = el.getAttribute('data-' + lang);
  }
}
</script>
</body>
</html>
